<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random MTG Creature</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 { margin-bottom: 1.5rem; color: #c9a227; }
        .controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            align-items: center;
        }
        label { font-size: 1.1rem; }
        input[type="number"] {
            width: 5rem;
            padding: 0.5rem;
            font-size: 1.1rem;
            border: 2px solid #c9a227;
            border-radius: 6px;
            background: #16213e;
            color: #e0e0e0;
            text-align: center;
        }
        button {
            padding: 0.5rem 1.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 6px;
            background: #c9a227;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #e0b830; }
        button:disabled { opacity: 0.5; cursor: wait; }
        #result {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        #result img.card-img {
            max-width: 350px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .thermal-wrap {
            background: #fff;
            padding: 0;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .error { color: #e74c3c; font-size: 1.1rem; }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #333;
            border-top-color: #c9a227;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #print-btn {
            display: none;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>Random MTG Creature</h1>
    <div class="controls">
        <label for="cmc">Mana Value:</label>
        <input type="number" id="cmc" min="0" max="20" value="3">
        <button id="btn" onclick="fetchCreature()">Go!</button>
    </div>
    <div class="controls">
        <label for="format">Editionen:</label>
        <select id="format" style="padding:0.5rem;font-size:1.1rem;border:2px solid #c9a227;border-radius:6px;background:#16213e;color:#e0e0e0;">
            <option value="all">Alle Editionen</option>
            <option value="standard">Standard</option>
            <option value="pioneer">Pioneer</option>
            <option value="modern">Modern</option>
            <option value="pauper">Pauper</option>
            <option value="premodern">Premodern</option>
        </select>
        <label for="un-sets">Un-Sets:</label>
        <select id="un-sets" style="padding:0.5rem;font-size:1.1rem;border:2px solid #c9a227;border-radius:6px;background:#16213e;color:#e0e0e0;">
            <option value="normal">Ohne Un-Sets</option>
            <option value="include">Mit Un-Sets</option>
            <option value="only">Nur Un-Sets</option>
        </select>
    </div>
    <div id="result"></div>
    <button id="print-btn" onclick="printThermal()">Drucken</button>

    <script>
        // Real Magic card: 63mm x 88mm
        // Thermal printer: 58mm wide, 384 dots → 6.62 dots/mm
        // Card scaled to printer width: 58mm x 81mm (proportional)
        // Height in dots: 81 * (384/58) ≈ 536px
        const THERMAL_WIDTH = 384;
        const CARD_HEIGHT = 536;
        const BORDER = 8;           // outer card border
        const INNER_PAD = 6;        // padding inside each box
        const INNER_LEFT = BORDER + 2;
        const INNER_RIGHT = THERMAL_WIDTH - BORDER - 2;
        const INNER_WIDTH = INNER_RIGHT - INNER_LEFT;
        const TEXT_WIDTH = INNER_WIDTH - INNER_PAD * 2;

        // Proportions based on real Magic card layout (% of inner height)
        // Name bar: ~6%, Art: ~44%, Type bar: ~6%, Text box: ~38%, P/T overlap bottom-right
        const INNER_TOP = BORDER + 2;
        const INNER_HEIGHT = CARD_HEIGHT - (BORDER + 2) * 2;
        const NAME_H = Math.round(INNER_HEIGHT * 0.06);
        const ART_H = Math.round(INNER_HEIGHT * 0.44);
        const TYPE_H = Math.round(INNER_HEIGHT * 0.06);
        const TEXT_H = INNER_HEIGHT - NAME_H - ART_H - TYPE_H - 6; // 6px gaps

        function wrapText(ctx, text, maxWidth) {
            const lines = [];
            const paragraphs = text.split('\n');
            for (const para of paragraphs) {
                if (para.trim() === '') { lines.push(''); continue; }
                const words = para.split(' ');
                let line = '';
                for (const word of words) {
                    const test = line ? line + ' ' + word : word;
                    if (ctx.measureText(test).width > maxWidth && line) {
                        lines.push(line);
                        line = word;
                    } else {
                        line = test;
                    }
                }
                if (line) lines.push(line);
            }
            return lines;
        }

        function floydSteinbergDither(imageData) {
            const { data, width, height } = imageData;
            const gray = new Float32Array(width * height);
            for (let i = 0; i < gray.length; i++) {
                gray[i] = 0.299 * data[i * 4] + 0.587 * data[i * 4 + 1] + 0.114 * data[i * 4 + 2];
            }
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    const old = gray[idx];
                    const nw = old < 128 ? 0 : 255;
                    gray[idx] = nw;
                    const err = old - nw;
                    if (x + 1 < width) gray[idx + 1] += err * 7 / 16;
                    if (y + 1 < height) {
                        if (x - 1 >= 0) gray[(y + 1) * width + x - 1] += err * 3 / 16;
                        gray[(y + 1) * width + x] += err * 5 / 16;
                        if (x + 1 < width) gray[(y + 1) * width + x + 1] += err * 1 / 16;
                    }
                }
            }
            for (let i = 0; i < gray.length; i++) {
                const v = gray[i];
                data[i * 4] = v;
                data[i * 4 + 1] = v;
                data[i * 4 + 2] = v;
                data[i * 4 + 3] = 255;
            }
            return imageData;
        }

        async function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        function getOracleText(card) {
            if (card.oracle_text) return card.oracle_text;
            if (card.card_faces) {
                return card.card_faces.map(f => f.oracle_text).filter(Boolean).join('\n---\n');
            }
            return '';
        }

        function getManaCost(card) {
            if (card.mana_cost) return card.mana_cost;
            if (card.card_faces) {
                return card.card_faces.map(f => f.mana_cost).filter(Boolean).join(' // ');
            }
            return '';
        }

        async function renderThermalCard(card) {
            const canvas = document.createElement('canvas');
            canvas.width = THERMAL_WIDTH;
            canvas.height = CARD_HEIGHT;
            const ctx = canvas.getContext('2d');

            const name = card.name;
            const manaCost = getManaCost(card);
            const typeLine = card.type_line || '';
            const oracle = getOracleText(card);
            const pt = (card.power != null && card.toughness != null)
                ? `${card.power}/${card.toughness}` : null;
            const artUrl = card.image_uris?.art_crop
                || card.card_faces?.[0]?.image_uris?.art_crop
                || null;

            // --- Background & outer border ---
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, THERMAL_WIDTH, CARD_HEIGHT);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.strokeRect(BORDER / 2, BORDER / 2, THERMAL_WIDTH - BORDER, CARD_HEIGHT - BORDER);

            // --- Section Y positions ---
            let yPos = INNER_TOP;

            // === NAME BAR ===
            const nameBarY = yPos;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(INNER_LEFT, nameBarY, INNER_WIDTH, NAME_H);

            // Adaptive name font: largest that fits in one line with mana cost
            ctx.fillStyle = '#000';
            let nameFontSize = 20;
            const nameGap = 8;
            for (let fs = 20; fs >= 10; fs--) {
                ctx.font = `bold ${fs}px serif`;
                const totalW = ctx.measureText(name).width + nameGap + ctx.measureText(manaCost).width;
                if (totalW <= TEXT_WIDTH && fs * 1.2 <= NAME_H) {
                    nameFontSize = fs;
                    break;
                }
                nameFontSize = fs;
            }
            ctx.font = `bold ${nameFontSize}px serif`;
            const nameTextY = nameBarY + NAME_H / 2 + nameFontSize * 0.35;
            ctx.fillText(name, INNER_LEFT + INNER_PAD, nameTextY);
            const costW = ctx.measureText(manaCost).width;
            ctx.fillText(manaCost, INNER_RIGHT - INNER_PAD - costW, nameTextY);

            yPos += NAME_H + 2;

            // === ART BOX ===
            const artBoxY = yPos;
            ctx.strokeRect(INNER_LEFT, artBoxY, INNER_WIDTH, ART_H);

            if (artUrl) {
                try {
                    const img = await loadImage(artUrl);
                    const tmpCanvas = document.createElement('canvas');
                    tmpCanvas.width = INNER_WIDTH;
                    tmpCanvas.height = ART_H;
                    const tmpCtx = tmpCanvas.getContext('2d');
                    // Cover-fit the art
                    const srcRatio = img.width / img.height;
                    const dstRatio = INNER_WIDTH / ART_H;
                    let sx = 0, sy = 0, sw = img.width, sh = img.height;
                    if (srcRatio > dstRatio) {
                        sw = img.height * dstRatio;
                        sx = (img.width - sw) / 2;
                    } else {
                        sh = img.width / dstRatio;
                        sy = (img.height - sh) / 2;
                    }
                    tmpCtx.drawImage(img, sx, sy, sw, sh, 0, 0, INNER_WIDTH, ART_H);
                    let imgData = tmpCtx.getImageData(0, 0, INNER_WIDTH, ART_H);
                    imgData = floydSteinbergDither(imgData);
                    tmpCtx.putImageData(imgData, 0, 0);
                    ctx.drawImage(tmpCanvas, INNER_LEFT, artBoxY);
                } catch (e) {
                    ctx.fillStyle = '#ccc';
                    ctx.fillRect(INNER_LEFT + 1, artBoxY + 1, INNER_WIDTH - 2, ART_H - 2);
                }
            }

            yPos += ART_H + 2;

            // === TYPE BAR ===
            const typeBarY = yPos;
            ctx.strokeStyle = '#000';
            ctx.strokeRect(INNER_LEFT, typeBarY, INNER_WIDTH, TYPE_H);
            ctx.fillStyle = '#000';
            // Adaptive type font
            let typeFontSize = 18;
            for (let fs = 18; fs >= 10; fs--) {
                ctx.font = `bold ${fs}px serif`;
                if (ctx.measureText(typeLine).width <= TEXT_WIDTH && fs * 1.2 <= TYPE_H) {
                    typeFontSize = fs;
                    break;
                }
                typeFontSize = fs;
            }
            ctx.font = `bold ${typeFontSize}px serif`;
            ctx.fillText(typeLine, INNER_LEFT + INNER_PAD, typeBarY + TYPE_H / 2 + typeFontSize * 0.35);

            yPos += TYPE_H + 2;

            // === TEXT BOX ===
            const textBoxY = yPos;
            ctx.strokeStyle = '#000';
            ctx.strokeRect(INNER_LEFT, textBoxY, INNER_WIDTH, TEXT_H);

            // Adaptive font size: try largest first, shrink until text fits
            ctx.fillStyle = '#000';
            const maxTextY = textBoxY + TEXT_H - (pt ? 20 : 4);
            const availH = maxTextY - textBoxY - INNER_PAD * 2;
            let bestFontSize = 20;
            let oracleLines, lineH;

            for (let fs = 20; fs >= 9; fs--) {
                ctx.font = `${fs}px serif`;
                const lines = wrapText(ctx, oracle, TEXT_WIDTH);
                const lh = Math.round(fs * 1.3);
                const totalTextH = lines.length * lh;
                if (totalTextH <= availH || fs === 9) {
                    bestFontSize = fs;
                    oracleLines = lines;
                    lineH = lh;
                    break;
                }
            }

            ctx.font = `${bestFontSize}px serif`;
            let ty = textBoxY + INNER_PAD + bestFontSize;
            for (const line of oracleLines) {
                if (ty > maxTextY) break;
                ctx.fillText(line, INNER_LEFT + INNER_PAD, ty);
                ty += lineH;
            }

            // === POWER / TOUGHNESS (bottom-right box, overlapping text box border) ===
            if (pt) {
                // Adaptive P/T font: scale with oracle text size, but at least as big
                const ptFontSize = Math.max(bestFontSize, Math.min(24, bestFontSize + 6));
                ctx.font = `bold ${ptFontSize}px serif`;
                const ptW = ctx.measureText(pt).width;
                const ptBoxW = ptW + 16;
                const ptBoxH = ptFontSize + 10;
                const ptBoxX = INNER_RIGHT - ptBoxW;
                const ptBoxY = textBoxY + TEXT_H - ptBoxH / 2;

                ctx.fillStyle = '#fff';
                ctx.fillRect(ptBoxX, ptBoxY, ptBoxW, ptBoxH);
                ctx.strokeStyle = '#000';
                ctx.strokeRect(ptBoxX, ptBoxY, ptBoxW, ptBoxH);
                ctx.fillStyle = '#000';
                ctx.fillText(pt, ptBoxX + 8, ptBoxY + ptFontSize * 0.8 + 3);
            }

            return canvas;
        }

        async function fetchCreature() {
            const cmc = document.getElementById('cmc').value;
            const result = document.getElementById('result');
            const btn = document.getElementById('btn');

            btn.disabled = true;
            result.innerHTML = '<div class="spinner"></div>';

            const unSetMode = document.getElementById('un-sets').value;
            const setFilter = unSetMode === 'only' ? ' is:funny' : unSetMode === 'include' ? '' : ' -is:funny';
            const formatMode = document.getElementById('format').value;
            const formatFilter = formatMode === 'all' ? '' : ` legal:${formatMode}`;
            const query = encodeURIComponent(`t:creature mv=${cmc} lang:en${setFilter}${formatFilter}`);
            const url = `https://api.scryfall.com/cards/random?q=${query}`;

            try {
                const res = await fetch(url);
                if (!res.ok) {
                    const err = await res.json();
                    result.innerHTML = `<p class="error">${err.details || 'No creature found with mana value ' + cmc + '.'}</p>`;
                    return;
                }
                const card = await res.json();

                // Regular card image
                const imgUrl = card.image_uris?.normal
                    || card.card_faces?.[0]?.image_uris?.normal
                    || '';

                result.innerHTML = '';

                // Left: regular card
                if (imgUrl) {
                    const img = document.createElement('img');
                    img.src = imgUrl;
                    img.alt = card.name;
                    img.className = 'card-img';
                    result.appendChild(img);
                }

                // Right: thermal print version
                const thermalCanvas = await renderThermalCard(card);
                const wrap = document.createElement('div');
                wrap.className = 'thermal-wrap';
                wrap.appendChild(thermalCanvas);
                result.appendChild(wrap);

                document.getElementById('print-btn').style.display = 'inline-block';

            } catch (e) {
                result.innerHTML = `<p class="error">Request failed: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        async function printThermal() {
            const canvas = document.querySelector('.thermal-wrap canvas');
            if (!canvas) return;

            // Convert canvas to PNG blob to avoid large raw transfer
            const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));

            const btn = document.getElementById('print-btn');
            btn.disabled = true;
            btn.textContent = 'Drucke…';
            try {
                const res = await fetch('http://127.0.0.1:8432', {
                    method: 'POST',
                    headers: { 'Content-Type': 'image/png' },
                    body: blob
                });
                if (!res.ok) throw new Error(await res.text());
                btn.textContent = 'Gedruckt!';
                setTimeout(() => { btn.textContent = 'Drucken'; }, 2000);
            } catch (e) {
                btn.textContent = 'Fehler!';
                alert('Druckfehler: ' + e.message + '\n\nLäuft der Print-Server?\n  sudo python3 print-server.py');
                setTimeout(() => { btn.textContent = 'Drucken'; }, 2000);
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('cmc').addEventListener('keydown', e => {
            if (e.key === 'Enter') fetchCreature();
        });
    </script>
</body>
</html>
